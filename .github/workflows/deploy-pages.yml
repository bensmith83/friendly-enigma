name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'blog/**'
      - 'arxiv-scraper/**'
      - 'cvss-converter/**'
      - 'scifi-opening-generator/**'
      - 'als-research-aggregator/**'
      - 'weird-science-fact/**'
      - 'tls-toolkit/**'
      - 'network-scanner/**'
      - 'mermaid-diagrams/**'
      - 'browser-vulnerability-scanner/**'
      - 'ai-honeypot-generator/**'
      - 'wasm-testbed/**'
      - 'cybersecurity-job-analyzer/**'
      - 'about/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'blog/**'
      - 'arxiv-scraper/**'
      - 'cvss-converter/**'
      - 'scifi-opening-generator/**'
      - 'als-research-aggregator/**'
      - 'tls-toolkit/**'
      - 'network-scanner/**'
      - 'mermaid-diagrams/**'
      - 'browser-vulnerability-scanner/**'
      - 'ai-honeypot-generator/**'
      - 'wasm-testbed/**'
      - 'cybersecurity-job-analyzer/**'
      - 'about/**'
  # Auto-deploy after data-generating workflows complete
  workflow_run:
    workflows:
      - "Scrape ArXiv Papers"
      - "Generate Sci-Fi Content"
      - "ALS Research Aggregator"
      - "Generate Science Facts"
      - "Cybersecurity Job Analyzer"
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if triggered by a failed workflow_run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./blog
        env:
          BUNDLE_PATH: ${{ github.workspace }}/.bundle-gems

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll blog
        working-directory: ./blog
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}/blog"
        env:
          JEKYLL_ENV: production
          BUNDLE_PATH: ${{ github.workspace }}/.bundle-gems

      - name: Create combined site
        run: |
          # Create output directory
          mkdir -p _site

          # Copy blog to /blog subdirectory
          cp -r blog/_site _site/blog

          # Copy arxiv-scraper to /arxiv-scraper subdirectory
          cp -r arxiv-scraper _site/arxiv-scraper

          # Copy cvss-converter to /cvss-converter subdirectory
          cp -r cvss-converter _site/cvss-converter

          # Copy scifi-opening-generator to /scifi-opening-generator subdirectory
          cp -r scifi-opening-generator _site/scifi-opening-generator

          # Copy als-research-aggregator to /als-research-aggregator subdirectory
          cp -r als-research-aggregator _site/als-research-aggregator

          # Copy weird-science-fact to /weird-science-fact subdirectory
          cp -r weird-science-fact _site/weird-science-fact

          # Copy tls-toolkit to /tls-toolkit subdirectory
          cp -r tls-toolkit _site/tls-toolkit

          # Copy network-scanner to /network-scanner subdirectory
          cp -r network-scanner _site/network-scanner

          # Copy mermaid-diagrams to /mermaid-diagrams subdirectory
          cp -r mermaid-diagrams _site/mermaid-diagrams

          # Copy browser-vulnerability-scanner to /browser-vulnerability-scanner subdirectory
          cp -r browser-vulnerability-scanner _site/browser-vulnerability-scanner

          # Copy ai-honeypot-generator honeypots to /ai-honeypot-generator subdirectory
          mkdir -p _site/ai-honeypot-generator
          cp -r ai-honeypot-generator/honeypots/* _site/ai-honeypot-generator/

          # Copy wasm-testbed to /wasm-testbed subdirectory
          cp -r wasm-testbed _site/wasm-testbed

          # Copy cybersecurity-job-analyzer to /cybersecurity-job-analyzer subdirectory
          mkdir -p _site/cybersecurity-job-analyzer
          cp -r cybersecurity-job-analyzer/index.html cybersecurity-job-analyzer/styles.css cybersecurity-job-analyzer/script.js _site/cybersecurity-job-analyzer/
          cp -r cybersecurity-job-analyzer/data _site/cybersecurity-job-analyzer/data 2>/dev/null || mkdir -p _site/cybersecurity-job-analyzer/data

          # Copy about to /about subdirectory
          cp -r about _site/about

          # Create index.html that redirects to blog or provides navigation
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>My Projects</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                      line-height: 1.6;
                      background: #f5f5f5;
                      padding: 2rem;
                  }
                  .container {
                      max-width: 600px;
                      margin: 0 auto;
                      background: white;
                      padding: 3rem;
                      border-radius: 8px;
                      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                  }
                  h1 { margin-bottom: 1.5rem; color: #333; }
                  .projects { display: flex; flex-direction: column; gap: 1rem; }
                  .project-link {
                      display: block;
                      padding: 1.5rem;
                      background: #f8f8f8;
                      border-radius: 4px;
                      text-decoration: none;
                      color: #0066cc;
                      border-left: 4px solid #0066cc;
                      transition: all 0.2s;
                  }
                  .project-link:hover {
                      background: #e8e8e8;
                      transform: translateX(4px);
                  }
                  .project-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; }
                  .project-desc { color: #666; font-size: 0.95rem; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>My Projects</h1>
                  <div class="projects">
                      <a href="/friendly-enigma/about/" class="project-link">
                          <div class="project-title">👤 About Me</div>
                          <div class="project-desc">Operator profile and network links</div>
                      </a>
                      <a href="/friendly-enigma/blog/" class="project-link">
                          <div class="project-title">📝 Blog</div>
                          <div class="project-desc">Personal blog with thoughts, quotes, and links</div>
                      </a>
                      <a href="/friendly-enigma/arxiv-scraper/" class="project-link">
                          <div class="project-title">📚 ArXiv Papers</div>
                          <div class="project-desc">Daily curated AI and Cybersecurity research papers</div>
                      </a>
                      <a href="/friendly-enigma/cvss-converter/" class="project-link">
                          <div class="project-title">🔐 CVSS Converter</div>
                          <div class="project-desc">Convert between CVSS v3.x and v4.0 vulnerability scores</div>
                      </a>
                      <a href="/friendly-enigma/scifi-opening-generator/" class="project-link">
                          <div class="project-title">🚀 Sci-Fi Opening Generator</div>
                          <div class="project-desc">Random compelling sci-fi story openings inspired by award-winning novels</div>
                      </a>
                      <a href="/friendly-enigma/als-research-aggregator/" class="project-link">
                          <div class="project-title">🔬 ALS Research Aggregator</div>
                          <div class="project-desc">Weekly curated ALS research, news, and NJ local resources</div>
                      </a>
                      <a href="/friendly-enigma/weird-science-fact/" class="project-link">
                          <div class="project-title">🧪 Weird Science Fact Generator</div>
                          <div class="project-desc">AI-generated bizarre science facts, fact-checked and illustrated</div>
                      </a>
                      <a href="/friendly-enigma/tls-toolkit/" class="project-link">
                          <div class="project-title">🔒 TLS Toolkit</div>
                          <div class="project-desc">Visualize TLS handshakes and inspect X.509 certificates</div>
                      </a>
                      <a href="/friendly-enigma/network-scanner/" class="project-link">
                          <div class="project-title">📡 Network Scanner</div>
                          <div class="project-desc">WiFi and Bluetooth environment visualizer with radar interface</div>
                      </a>
                      <a href="/friendly-enigma/mermaid-diagrams/" class="project-link">
                          <div class="project-title">📊 Mermaid Diagrams</div>
                          <div class="project-desc">Create and visualize diagrams using Mermaid syntax</div>
                      </a>
                      <a href="/friendly-enigma/browser-vulnerability-scanner/" class="project-link">
                          <div class="project-title">🔍 Browser Vulnerability Scanner</div>
                          <div class="project-desc">Detect security vulnerabilities in your browser and OS based on version</div>
                      </a>
                      <a href="/friendly-enigma/ai-honeypot-generator/" class="project-link">
                          <div class="project-title">🍯 Internal Services</div>
                          <div class="project-desc">Development and automation tools portal</div>
                      </a>
                      <a href="/friendly-enigma/cybersecurity-job-analyzer/" class="project-link">
                          <div class="project-title">🛡️ Cybersecurity Job Analyzer</div>
                          <div class="project-desc">Weekly analysis of cybersecurity hiring trends, strategy signals, and salary data</div>
                      </a>
                      <a href="/friendly-enigma/wasm-testbed/" class="project-link">
                          <div class="project-title">🚀 WebAssembly Performance Lab</div>
                          <div class="project-desc">Interactive testbed for exploring WebAssembly with performance benchmarks</div>
                      </a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Deploy on push to main/master or after successful workflow_run
    if: |
      (github.event_name == 'workflow_run') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Cybersecurity Job Tracker - Weekly job scraping and analysis
# Runs every Sunday at 6 AM UTC (1 AM EST)

name: Cybersecurity Job Tracker

on:
  schedule:
    # Weekly on Sunday at 6 AM UTC
    - cron: '0 6 * * 0'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      skip_company_update:
        description: 'Skip company list update step'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  track-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r cybersecurity-job-tracker/scripts/requirements.txt

      - name: Update company list
        if: ${{ github.event.inputs.skip_company_update != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd cybersecurity-job-tracker/scripts
          python update_companies.py

      - name: Scrape job listings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd cybersecurity-job-tracker/scripts
          python scrape_jobs.py

      - name: Analyze jobs and generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MODEL: ${{ vars.CYBER_ANALYSIS_MODEL || 'claude-sonnet-4-5-20250514' }}
        run: |
          cd cybersecurity-job-tracker/scripts
          python analyze_jobs.py

      - name: Check for changes
        id: check_changes
        run: |
          git add cybersecurity-job-tracker/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git commit -m "Update cybersecurity job tracker - $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            git push && break
            echo "Push attempt $i failed, retrying in $((i * 2))s..."
            sleep $((i * 2))
          done

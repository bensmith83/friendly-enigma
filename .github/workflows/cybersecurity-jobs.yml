# Cybersecurity Job Analyzer - Weekly analysis
# Runs every Sunday at 6 AM UTC (1 AM EST)
# Three-stage pipeline: discover companies -> scrape careers -> analyze jobs

name: Cybersecurity Job Analyzer

on:
  schedule:
    # Weekly on Sunday at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Which stage to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - discover
          - scrape
          - analyze

permissions:
  contents: write

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cybersecurity-job-analyzer/scripts/package-lock.json

      - name: Install dependencies
        working-directory: cybersecurity-job-analyzer/scripts
        run: npm ci

      - name: Run tests
        working-directory: cybersecurity-job-analyzer/scripts
        run: npm test

      - name: Discover companies
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'discover' || github.event_name == 'schedule' }}
        working-directory: cybersecurity-job-analyzer/scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node discover-companies.js

      - name: Scrape career pages
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'scrape' || github.event_name == 'schedule' }}
        working-directory: cybersecurity-job-analyzer/scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scrape-careers.js

      - name: Analyze job listings
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'analyze' || github.event_name == 'schedule' }}
        working-directory: cybersecurity-job-analyzer/scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node analyze-jobs.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet cybersecurity-job-analyzer/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git add cybersecurity-job-analyzer/data/
          git commit -m "Update cybersecurity job analysis - $(date +'%Y-%m-%d')"
          git push
